dataset:
  confidence_threshold: 2
  max_depth: 10.0
  min_depth: 0.1
  root: data/arkitscenes
  target_hw:
  - 768
  - 1024
  test_split_path: splits/test.txt
  train_crop_hw:
  - 512
  - 640
  train_split_path: splits/train.txt
  val_split_path: splits/val.txt
evaluation:
  warmup_samples: 1
loader:
  batch_size: 16
  num_workers: 8
model:
  depth_channels:
  - 32
  - 64
  - 128
  - 256
  depth_encoder_levels: 4
  depth_filter_size: 3
  fusion_decoder_channels:
  - 256
  - 128
  - 64
  - 32
  pretrained_rgb: true
  residual_scale: 0.2
optimizer:
  learning_rate: 0.0006
  name: adamw
  weight_decay: 0.0001
training:
  epochs: 10
  freeze_rgb_epochs: 1
  grad_clip_norm: 1.0
  lambda_grad: 0.5
  max_steps: 300
